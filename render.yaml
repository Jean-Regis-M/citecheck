services:
  - type: web
    name: citecheck
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: RATE_LIMIT_PER_HOUR
        value: "10"
      - key: GEMINI_API_KEY
        sync: false
